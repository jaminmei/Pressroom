name: Public CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  public-boundary:
    name: Public boundary and secrets
    if: github.ref_type != 'tag' || github.repository == 'jaminmei/doc-conv'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full public history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate public tree and provenance
        shell: bash
        run: |
          set -euo pipefail
          args=(--expected-origin "${{ github.repository }}")
          if [[ "${{ github.ref_name }}" == "v0.2.0" ]]; then
            args+=(--initial-release-tag "${{ github.ref_name }}")
          fi
          python3 scripts/check-public-boundary.py "${args[@]}"

      - name: Verify deterministic public fixtures
        run: python3 scripts/generate-public-fixtures.py --check

      - name: Validate license and SPDX scope
        run: python3 scripts/check-license-scope.py

      - name: Scan committed content for secrets
        shell: bash
        run: |
          image='zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055'
          docker run --rm -v "$PWD:/repo:ro" "$image" git /repo \
            --config /repo/.gitleaks.toml --log-opts='--all --full-history' \
            --no-banner --redact
          docker run --rm -v "$PWD:/repo:ro" "$image" dir /repo \
            --config /repo/.gitleaks.toml --no-banner --redact

      - name: Check documentation links
        uses: lycheeverse/lychee-action@7da8ec1fc4e01b5a12062ac6c589c10a4ce70d67 # v2.0.0
        with:
          args: >-
            --no-progress
            --offline
            --exclude-all-private
            --exclude '^https?://(localhost|127\.0\.0\.1)(:|/)'
            './**/*.md'
          fail: true

  release-provenance:
    name: Release provenance
    if: >-
      github.repository == 'jaminmei/Pressroom' &&
      (
        (
          github.event_name == 'pull_request' &&
          github.base_ref == 'main'
        ) ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        )
      )
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.provenance.outputs.tag }}
      source_commit: ${{ steps.provenance.outputs.source_commit }}
      source_tree: ${{ steps.provenance.outputs.source_tree }}
      pull_number: ${{ steps.provenance.outputs.pull_number }}
      head_commit: ${{ steps.provenance.outputs.head_commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate release App, metadata, ancestry, and tree
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_release_provenance.py

  website-pages-build:
    name: Build Press Room Docs
    if: >-
      github.repository == 'jaminmei/Pressroom' &&
      (
        (
          github.event_name == 'pull_request' &&
          github.base_ref == 'main'
        ) ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        )
      )
    needs: [public-boundary, release-provenance]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
          registry-url: https://registry.npmjs.org
      - name: Install documentation dependencies from the public lock
        working-directory: website
        run: npm ci
      - name: Reject critical documentation dependency findings
        working-directory: website
        run: npm audit --audit-level=critical
      - name: Build the GitHub Pages site
        working-directory: website
        run: npm run docs:build
      - name: Scan the generated documentation boundary
        run: python3 scripts/check-public-boundary.py --scan-dir website/.vitepress/dist
      - name: Scan the generated documentation for secrets
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          dir /repo/website/.vitepress/dist --config /repo/.gitleaks.toml --no-banner --redact
      - name: Upload the GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/.vitepress/dist

  finalize-pressroom-release:
    name: Finalize merged PressRoom release
    if: >-
      github.event_name == 'push' &&
      github.repository == 'jaminmei/Pressroom' &&
      github.ref == 'refs/heads/main'
    needs:
      [
        public-boundary,
        release-provenance,
        website-pages-build,
      ]
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create the immutable tag and draft release for a merged release PR
        shell: bash
        env:
          RELEASE_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-provenance.outputs.tag }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          api_url = os.environ["GITHUB_API_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          commit = os.environ["GITHUB_SHA"]
          token = os.environ["RELEASE_TOKEN"]
          tag = os.environ["RELEASE_TAG"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(
              method: str,
              path: str,
              payload: dict | None = None,
              *,
              allow_missing: bool = False,
          ) -> object | None:
              body = None
              request_headers = headers.copy()
              if payload is not None:
                  body = json.dumps(payload).encode()
                  request_headers["Content-Type"] = "application/json"
              req = urllib.request.Request(
                  f"{api_url}/repos/{repository}{path}",
                  data=body,
                  headers=request_headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if allow_missing and error.code == 404:
                      return None
                  raise SystemExit("PressRoom release finalization API request failed") from error

          if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) is None:
              raise SystemExit("release provenance did not provide a valid tag")
          encoded_tag = urllib.parse.quote(tag, safe="")
          existing_ref = request(
              "GET",
              f"/git/ref/tags/{encoded_tag}",
              allow_missing=True,
          )
          if existing_ref is None:
              tag_object = request(
                  "POST",
                  "/git/tags",
                  {
                      "tag": tag,
                      "message": f"Public release {tag}",
                      "object": commit,
                      "type": "commit",
                      "tagger": {
                          "name": "PressRoom Release Sync",
                          "email": "pressroom-release-sync@users.noreply.github.com",
                          "date": dt.datetime.now(dt.UTC).isoformat(),
                      },
                  },
              )
              if not isinstance(tag_object, dict) or not tag_object.get("sha"):
                  raise SystemExit("unable to create annotated release tag object")
              request(
                  "POST",
                  "/git/refs",
                  {"ref": f"refs/tags/{tag}", "sha": tag_object["sha"]},
              )
          elif isinstance(existing_ref, dict):
              target = existing_ref.get("object", {})
              if target.get("type") != "tag":
                  raise SystemExit("existing release tag is not annotated")
              tag_object = request("GET", f"/git/tags/{target.get('sha', '')}")
              if not isinstance(tag_object, dict) or tag_object.get("object", {}).get("sha") != commit:
                  raise SystemExit("existing release tag points to another commit")
          else:
              raise SystemExit("unexpected release tag response")

          release = {
              "tag_name": tag,
              "target_commitish": commit,
              "name": tag,
              "draft": True,
              "prerelease": False,
              "generate_release_notes": True,
          }
          existing_release = request(
              "GET",
              f"/releases/tags/{encoded_tag}",
              allow_missing=True,
          )
          if existing_release is None:
              request("POST", "/releases", release)
          elif isinstance(existing_release, dict) and existing_release.get("draft"):
              request("PATCH", f"/releases/{existing_release['id']}", release)
          PY

  deploy-pages:
    name: Deploy Press Room Docs
    if: >-
      github.event_name == 'push' &&
      github.repository == 'jaminmei/Pressroom' &&
      github.ref == 'refs/heads/main'
    needs: [website-pages-build, finalize-pressroom-release]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
