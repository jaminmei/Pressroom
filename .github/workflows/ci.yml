name: Public CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop, main]
    tags: ["v*"]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-boundary:
    name: Public boundary and secrets
    if: github.ref_type != 'tag' || github.repository == 'jaminmei/doc-conv'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full public history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate public tree and provenance
        shell: bash
        run: |
          set -euo pipefail
          args=(--expected-origin "${{ github.repository }}")
          if [[ "${{ github.ref_name }}" == "v0.2.0" ]]; then
            args+=(--initial-release-tag "${{ github.ref_name }}")
          fi
          python3 scripts/check-public-boundary.py "${args[@]}"

      - name: Verify deterministic public fixtures
        run: python3 scripts/generate-public-fixtures.py --check

      - name: Validate license and SPDX scope
        run: python3 scripts/check-license-scope.py

      - name: Scan committed content for secrets
        shell: bash
        run: |
          image='zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055'
          docker run --rm -v "$PWD:/repo:ro" "$image" git /repo \
            --config /repo/.gitleaks.toml --log-opts='--all --full-history' \
            --no-banner --redact
          docker run --rm -v "$PWD:/repo:ro" "$image" dir /repo \
            --config /repo/.gitleaks.toml --no-banner --redact

      - name: Check documentation links
        uses: lycheeverse/lychee-action@7da8ec1fc4e01b5a12062ac6c589c10a4ce70d67 # v2.0.0
        with:
          args: >-
            --no-progress
            --offline
            --exclude-all-private
            --exclude '^https?://(localhost|127\.0\.0\.1)(:|/)'
            './**/*.md'
          fail: true

  release-provenance:
    name: Release provenance
    if: >-
      github.repository == 'jaminmei/Pressroom' &&
      (
        (
          github.event_name == 'pull_request' &&
          github.base_ref == 'main'
        ) ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        )
      )
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.provenance.outputs.tag }}
      source_commit: ${{ steps.provenance.outputs.source_commit }}
      source_tree: ${{ steps.provenance.outputs.source_tree }}
      pull_number: ${{ steps.provenance.outputs.pull_number }}
      head_commit: ${{ steps.provenance.outputs.head_commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate release App, metadata, ancestry, and tree
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_release_provenance.py

  python-quality:
    name: Python quality and tests
    if: github.repository == 'jaminmei/doc-conv'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            tests/requirements-text-engine.lock
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          # Root tests exercise the separately licensed Text engine through its
          # own source modules. Install only its parser test dependencies here;
          # the service itself remains locked and deployed independently.
          python -m pip install --require-hashes -r tests/requirements-text-engine.lock
      - name: Install backend runtime system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy app
      - name: Generate test-only process secrets
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import os
          import secrets

          values = {
              "AUTH_SESSION_SECRET": secrets.token_urlsafe(48),
              "PROVIDER_ENCRYPTION_KEY": base64.urlsafe_b64encode(
                  secrets.token_bytes(32)
              ).decode(),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              for name, value in values.items():
                  print(f"::add-mask::{value}")
                  environment.write(f"{name}={value}\n")
          PY
      - name: Start the test Text engine
        working-directory: engines/text
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn app:app --host 127.0.0.1 --port 8004 \
            >"$RUNNER_TEMP/text-engine.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/text-engine.pid"
          python3 - <<'PY'
          import time
          import urllib.error
          import urllib.request

          deadline = time.monotonic() + 30
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8004/health", timeout=2) as response:
                      if response.status == 200:
                          break
              except (OSError, urllib.error.URLError):
                  time.sleep(0.5)
          else:
              raise SystemExit("test Text engine did not become healthy")
          PY
      - name: Pytest
        env:
          WORKSPACE_RBAC_ENFORCED: "true"
        run: pytest -q
      - name: Stop the test Text engine
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/text-engine.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/text-engine.pid")" 2>/dev/null || true
          fi

  dependency-audit:
    name: Python dependency audit
    if: github.repository == 'jaminmei/doc-conv'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit backend and engines
        shell: bash
        run: |
          set -euo pipefail
          pip-audit -r requirements.lock --no-deps --disable-pip --require-hashes
          pip-audit -r requirements-dev.lock --no-deps --disable-pip --require-hashes
          pip-audit -r tests/requirements-text-engine.lock --no-deps --disable-pip --require-hashes
          for lock in engines/*/requirements.lock; do
            if [[ "$lock" == "engines/layout-detection/requirements.lock" ]]; then
              pip-audit -r "$lock" --no-deps --disable-pip --require-hashes \
                --ignore-vuln PYSEC-2026-356 \
                --ignore-vuln PYSEC-2026-1754 \
                --ignore-vuln PYSEC-2026-1756
            else
              pip-audit -r "$lock" --no-deps --disable-pip --require-hashes
            fi
          done

  frontend-quality:
    name: Frontend quality and build
    if: github.repository == 'jaminmei/doc-conv'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          registry-url: https://registry.npmjs.org
      - name: Install from public lock
        working-directory: frontend
        run: npm ci
      - name: Audit production dependencies
        run: python3 scripts/check-frontend-audit.py frontend
      - name: Reject unexplained critical development dependencies
        working-directory: frontend
        run: npm audit --audit-level=critical
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: Vitest
        working-directory: frontend
        run: npm run test -- --run
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Scan production bundle
        run: python3 scripts/check-public-boundary.py --scan-dir frontend/dist
      - name: Scan production bundle for secrets
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          dir /repo/frontend/dist --config /repo/.gitleaks.toml --no-banner --redact

  standard-compose:
    name: Standard Compose and public E2E
    if: github.repository == 'jaminmei/doc-conv'
    runs-on: ubuntu-latest
    needs: [public-boundary, python-quality, frontend-quality]
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: public_standard_${{ github.run_id }}_${{ github.run_attempt }}
      IS_SANDBOX: "1"
      ORCHESTRATOR_MODE: serial
      ENABLE_QUEUE_MODE: "false"
      PROVIDER_ALLOW_PRIVATE_HOSTS: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Reclaim hosted-runner disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost
          sudo apt-get clean
          docker builder prune --all --force
          df -h /
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Generate isolated CI secrets
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import os
          import secrets

          values = {
              "AUTH_SESSION_SECRET": secrets.token_urlsafe(48),
              "POSTGRES_PASSWORD": secrets.token_urlsafe(32),
              "PROVIDER_ENCRYPTION_KEY": base64.urlsafe_b64encode(
                  secrets.token_bytes(32)
              ).decode(),
              "REDIS_PASSWORD": secrets.token_urlsafe(32),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              for name, value in values.items():
                  print(f"::add-mask::{value}")
                  environment.write(f"{name}={value}\n")
          PY
      - name: Validate standard and test Compose configuration
        run: docker compose --profile standard --profile test config --quiet
      - name: Install public E2E dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start standard application and mock upstream
        run: docker compose --profile standard --profile test up -d --build
      - name: Wait for application liveness
        run: TIMEOUT=420 bash scripts/wait-for-services.sh
      - name: Run public browser smoke tests
        working-directory: frontend
        env:
          PW_BASE_URL: http://127.0.0.1:5173
          PW_REUSE_EXISTING_SERVER: "true"
          VLM_MOCK_URL: http://127.0.0.1:18080
        run: npx playwright test --config=playwright.public.config.ts --project=chromium
      - name: Collect diagnostics
        if: failure()
        run: bash scripts/collect-service-logs.sh standard artifacts/standard
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: standard-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/standard
          if-no-files-found: warn
      - name: Teardown
        if: always()
        run: docker compose --profile standard --profile test down --remove-orphans -v

  full-queue:
    name: Full queue profile
    if: >-
      github.repository == 'jaminmei/doc-conv' &&
      (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (
          github.event_name == 'push' &&
          github.repository == 'jaminmei/doc-conv' &&
          startsWith(github.ref, 'refs/tags/v')
        ) ||
        (
          github.event_name == 'pull_request' &&
          github.base_ref == 'main' &&
          github.head_ref == 'develop' &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    needs: [public-boundary, python-quality, frontend-quality]
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: public_full_${{ github.run_id }}_${{ github.run_attempt }}
      IS_SANDBOX: "1"
      ORCHESTRATOR_MODE: queue
      ENABLE_QUEUE_MODE: "true"
      PROVIDER_ALLOW_PRIVATE_HOSTS: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Reclaim hosted-runner disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost
          sudo apt-get clean
          docker builder prune --all --force
          df -h /
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          registry-url: https://registry.npmjs.org
      - name: Install hash-locked test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install public E2E dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Generate isolated CI secrets
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import os
          import secrets

          values = {
              "AUTH_SESSION_SECRET": secrets.token_urlsafe(48),
              "POSTGRES_PASSWORD": secrets.token_urlsafe(32),
              "PROVIDER_ENCRYPTION_KEY": base64.urlsafe_b64encode(
                  secrets.token_bytes(32)
              ).decode(),
              "REDIS_PASSWORD": secrets.token_urlsafe(32),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              for name, value in values.items():
                  print(f"::add-mask::{value}")
                  environment.write(f"{name}={value}\n")
          PY
      - name: Validate full and test Compose configuration
        run: docker compose --profile full --profile test config --quiet
      - name: Start full queue profile and mock upstream
        run: docker compose --profile full --profile test up -d --build
      - name: Wait for application liveness
        run: TIMEOUT=420 bash scripts/wait-for-services.sh
      - name: Verify authenticated Redis ping
        run: |
          timeout 300 bash -c "until docker compose --profile full exec -T redis \
          redis-cli --no-auth-warning -a \"\$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG;
          do sleep 3; done"
      - name: Verify Celery worker
        run: >-
          timeout 300 bash -c 'until docker compose --profile full exec -T celery-worker
          celery -A app.worker inspect ping 2>/dev/null | grep -q pong;
          do sleep 5; done'
      - name: Verify full-profile network connectivity
        run: bash scripts/test-full-profile-connectivity.sh
      - name: Run queue integration contracts
        run: >-
          DATABASE_URL="postgresql+psycopg://docconv:${POSTGRES_PASSWORD}@127.0.0.1:5432/docconv"
          pytest -q tests/integration/test_queue_full_dag_parity.py
          tests/integration/test_celery_fallback.py
      - name: Run public browser smoke tests in queue mode
        working-directory: frontend
        env:
          PW_BASE_URL: http://127.0.0.1:5173
          PW_REUSE_EXISTING_SERVER: "true"
          VLM_MOCK_URL: http://127.0.0.1:18080
        run: npm run test:e2e
      - name: Collect diagnostics
        if: failure()
        run: bash scripts/collect-service-logs.sh full artifacts/full
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: full-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/full
          if-no-files-found: warn
      - name: Teardown
        if: always()
        run: docker compose --profile full --profile test down --remove-orphans -v

  publish-pressroom:
    name: Open PressRoom release pull request
    if: >-
      github.event_name == 'push' &&
      github.repository == 'jaminmei/doc-conv' &&
      startsWith(github.ref, 'refs/tags/v')
    needs:
      [
        public-boundary,
        python-quality,
        dependency-audit,
        frontend-quality,
        standard-compose,
        full-queue,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRESSROOM_REPOSITORY: jaminmei/Pressroom
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git cat-file -e "refs/tags/${tag}^{tag}"
          tag_commit="$(git rev-parse "refs/tags/${tag}^{commit}")"
          main_commit="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq '.object.sha'
          )"
          [[ "$tag_commit" == "$main_commit" ]]
          printf 'tag=%s\ncommit=%s\n' "$tag" "$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Create scoped PressRoom installation token
        id: pressroom-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.PRESSROOM_SYNC_APP_ID }}
          private-key: ${{ secrets.PRESSROOM_SYNC_APP_PRIVATE_KEY }}
          owner: jaminmei
          repositories: Pressroom

      - name: Prepare the PressRoom release branch
        id: sync
        shell: bash
        env:
          PRESSROOM_TOKEN: ${{ steps.pressroom-token.outputs.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          branch="publish/${RELEASE_TAG}"
          remote_url="https://x-access-token:${PRESSROOM_TOKEN}@github.com/${PRESSROOM_REPOSITORY}.git"
          git remote add pressroom "$remote_url"
          git fetch --quiet --no-tags pressroom \
            refs/heads/main:refs/remotes/pressroom/main
          target_commit="$(git rev-parse refs/remotes/pressroom/main)"
          target_tree="$(git rev-parse "${target_commit}^{tree}")"
          release_tree="$(git rev-parse "${RELEASE_COMMIT}^{tree}")"
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
          if [[ "$target_tree" == "$release_tree" ]]; then
            printf 'already_released=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_date="$(git show -s --format=%cI "$RELEASE_COMMIT")"
          export GIT_AUTHOR_NAME="PressRoom Release Sync"
          export GIT_AUTHOR_EMAIL="pressroom-release-sync@users.noreply.github.com"
          export GIT_AUTHOR_DATE="$release_date"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_COMMITTER_DATE="$release_date"
          sync_commit="$(
            printf 'release: sync %s from doc-conv\n' "$RELEASE_TAG" |
              git commit-tree "$release_tree" -p "$target_commit"
          )"

          existing="$(
            git ls-remote --heads pressroom "refs/heads/${branch}" |
              awk '{print $1}'
          )"
          if [[ -n "$existing" ]]; then
            git fetch --quiet --no-tags pressroom \
              "refs/heads/${branch}:refs/remotes/pressroom/${branch}"
            existing_tree="$(git rev-parse "${existing}^{tree}")"
            existing_parent="$(git rev-parse "${existing}^")"
            if [[ "$existing_tree" == "$release_tree" && "$existing_parent" == "$target_commit" ]]; then
              sync_commit="$existing"
            else
              git push --quiet pressroom \
                --force-with-lease="refs/heads/${branch}:${existing}" \
                "${sync_commit}:refs/heads/${branch}"
            fi
          else
            git push --quiet pressroom "${sync_commit}:refs/heads/${branch}"
          fi
          printf 'already_released=false\n' >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$sync_commit" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$release_tree" >> "$GITHUB_OUTPUT"

      - name: Create or update the PressRoom release pull request
        if: steps.sync.outputs.already_released != 'true'
        shell: bash
        env:
          PRESSROOM_TOKEN: ${{ steps.pressroom-token.outputs.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_TREE: ${{ steps.sync.outputs.tree }}
          RELEASE_BRANCH: ${{ steps.sync.outputs.branch }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          api_url = os.environ["GITHUB_API_URL"]
          repository = os.environ["PRESSROOM_REPOSITORY"]
          token = os.environ["PRESSROOM_TOKEN"]
          tag = os.environ["RELEASE_TAG"]
          commit = os.environ["RELEASE_COMMIT"]
          tree = os.environ["RELEASE_TREE"]
          branch = os.environ["RELEASE_BRANCH"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method: str, path: str, payload: dict | None = None) -> object:
              body = None
              request_headers = headers.copy()
              if payload is not None:
                  body = json.dumps(payload).encode()
                  request_headers["Content-Type"] = "application/json"
              req = urllib.request.Request(
                  f"{api_url}/repos/{repository}{path}",
                  data=body,
                  headers=request_headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise SystemExit("PressRoom pull request API request failed") from error

          title = f"Release {tag} from doc-conv"
          body = "\n".join(
              (
                  f"Publish `{tag}` from the validated doc-conv release tag.",
                  "",
                  f"Source commit: `{commit}`",
                  "",
                  f"Source tree: `{tree}`",
                  "",
                  "This PR must pass all PressRoom checks and receive the required approval.",
              )
          )
          head = urllib.parse.quote(f"jaminmei:{branch}", safe="")
          pulls = request("GET", f"/pulls?state=open&base=main&head={head}")
          if not isinstance(pulls, list):
              raise SystemExit("unexpected PressRoom pull request response")
          payload = {
              "title": title,
              "body": body,
              "base": "main",
              "head": branch,
              "draft": False,
              "maintainer_can_modify": False,
          }
          if pulls:
              update = {
                  "title": title,
                  "body": body,
                  "base": "main",
                  "maintainer_can_modify": False,
              }
              request("PATCH", f"/pulls/{pulls[0]['number']}", update)
          else:
              request("POST", "/pulls", payload)
          PY

  finalize-pressroom-release:
    name: Finalize merged PressRoom release
    if: >-
      github.event_name == 'push' &&
      github.repository == 'jaminmei/Pressroom' &&
      github.ref == 'refs/heads/main'
    needs:
      [
        public-boundary,
        release-provenance,
      ]
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create the immutable tag and draft release for a merged release PR
        shell: bash
        env:
          RELEASE_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-provenance.outputs.tag }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          api_url = os.environ["GITHUB_API_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          commit = os.environ["GITHUB_SHA"]
          token = os.environ["RELEASE_TOKEN"]
          tag = os.environ["RELEASE_TAG"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(
              method: str,
              path: str,
              payload: dict | None = None,
              *,
              allow_missing: bool = False,
          ) -> object | None:
              body = None
              request_headers = headers.copy()
              if payload is not None:
                  body = json.dumps(payload).encode()
                  request_headers["Content-Type"] = "application/json"
              req = urllib.request.Request(
                  f"{api_url}/repos/{repository}{path}",
                  data=body,
                  headers=request_headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if allow_missing and error.code == 404:
                      return None
                  raise SystemExit("PressRoom release finalization API request failed") from error

          if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) is None:
              raise SystemExit("release provenance did not provide a valid tag")
          encoded_tag = urllib.parse.quote(tag, safe="")
          existing_ref = request(
              "GET",
              f"/git/ref/tags/{encoded_tag}",
              allow_missing=True,
          )
          if existing_ref is None:
              tag_object = request(
                  "POST",
                  "/git/tags",
                  {
                      "tag": tag,
                      "message": f"Public release {tag}",
                      "object": commit,
                      "type": "commit",
                      "tagger": {
                          "name": "PressRoom Release Sync",
                          "email": "pressroom-release-sync@users.noreply.github.com",
                          "date": dt.datetime.now(dt.UTC).isoformat(),
                      },
                  },
              )
              if not isinstance(tag_object, dict) or not tag_object.get("sha"):
                  raise SystemExit("unable to create annotated release tag object")
              request(
                  "POST",
                  "/git/refs",
                  {"ref": f"refs/tags/{tag}", "sha": tag_object["sha"]},
              )
          elif isinstance(existing_ref, dict):
              target = existing_ref.get("object", {})
              if target.get("type") != "tag":
                  raise SystemExit("existing release tag is not annotated")
              tag_object = request("GET", f"/git/tags/{target.get('sha', '')}")
              if not isinstance(tag_object, dict) or tag_object.get("object", {}).get("sha") != commit:
                  raise SystemExit("existing release tag points to another commit")
          else:
              raise SystemExit("unexpected release tag response")

          release = {
              "tag_name": tag,
              "target_commitish": commit,
              "name": tag,
              "draft": True,
              "prerelease": False,
              "generate_release_notes": True,
          }
          existing_release = request(
              "GET",
              f"/releases/tags/{encoded_tag}",
              allow_missing=True,
          )
          if existing_release is None:
              request("POST", "/releases", release)
          elif isinstance(existing_release, dict) and existing_release.get("draft"):
              request("PATCH", f"/releases/{existing_release['id']}", release)
          PY
